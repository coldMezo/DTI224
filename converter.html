<!DOCTYPE html>
<html>

<head>
    <title>Temperature Converter</title>
</head>

<body>

<h2>Temperature Converter</h2>

<p>Enter Celsius:</p>
<input type="number" id="temp">

<button onclick="convert()">Convert</button>
<button onclick="goBack()">Back</button>

<p id="result"></p>

<script>

function convert() {

    var c = document.getElementById("temp").value;

    // Validation
    if (c == "") {
        document.getElementById("result").innerHTML = "Please enter a temperature.";
        return;
    }

    var f = (c * 9 / 5) + 32;

    document.getElementById("result").innerHTML = f + " Fahrenheit";

}

function goBack() {
    window.history.back();
}

</script>

</body>

</html>
