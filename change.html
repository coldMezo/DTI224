<!DOCTYPE html>
<html>
<head>
    <title>Calculate Change</title>
</head>
<body>

<h2>Calculate Change</h2>

<label>Enter Amount:</label>
<input type="number" id="amount">
<button onclick="change()">Submit</button>
<button onclick="goBack()">Back</button>

<br><br>

<div id="result"></div>

<script>

function change(){

    var amount = document.getElementById("amount").value;

    // Validation
    if(amount == ""){
        document.getElementById("result").innerHTML = "Please enter an amount.";
        return;
    }

    amount = Number(amount);

    if(amount < 0){
        document.getElementById("result").innerHTML = "Invalid amount.";
        return;
    }

    var notes = [1000,500,100,50,20,10,5,2,1];

    var text = "";

    for(var i=0; i<notes.length; i++){

        var count = Math.floor(amount / notes[i]);

        if(count > 0){

            text += count + " of $" + notes[i] + "<br>";

            amount = amount % notes[i];

        }

    }

    document.getElementById("result").innerHTML = text;

}

function goBack(){
    window.history.back();
}

</script>
    
</body>
</html>
